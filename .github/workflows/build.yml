name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded CI runs on the same branch/PR so stale emulator jobs cannot pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      # Blueprint 14A: the debug-only controls (abort, short blocks) must not exist in a release build.
      - name: Release manifest has no debug controls
        run: |
          set -eu
          manifest=$(find app/build/intermediates -path '*merged_manifests/release*' -name AndroidManifest.xml | head -1)
          echo "Checking $manifest"
          test -n "$manifest"
          if grep -q -e DEBUG_ -e DebugControlReceiver "$manifest"; then
            echo "::error::A debug control is present in the release manifest"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dechainer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
